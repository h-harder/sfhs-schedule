name: Sync school calendar

# Pulls the public SFHS School Schedule calendar and refreshes data/calendar.json
# so the site always knows which day (G1, B2, A1, …) it is.
on:
  schedule:
    - cron: '17 11 * * *' # daily, ~3–4am Pacific
    - cron: '17 23 * * 1-5' # weekday afternoons, to catch same-day changes for tomorrow
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-calendar.mjs
      - name: Commit if the calendar changed
        run: |
          if git diff --quiet -- data/calendar.json; then
            echo "Calendar unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json
          git commit -m "Sync school calendar"
          git push
